[package]
name = "agentvault-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Integration tests for Agent Vault Control Plane"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
agentvault-core = { workspace = true }
agentvault-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "process"] }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
